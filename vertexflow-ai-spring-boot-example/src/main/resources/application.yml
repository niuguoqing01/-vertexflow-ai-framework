server:
  port: 8088

vertexflow:
  ai:
    enabled: true
    provider: openai-compatible
    api-key: ${DEEPSEEK_API_KEY}
    base-url: https://api.deepseek.com/v1
    model: deepseek-chat
    temperature: 0.7
    max-tokens: 2048
    console-log: true
    memory:
      enabled: true
      max-messages: 10
      conversation-id: spring-demo-user
    rag:
      enabled: true
      top-k: 3
      return-sources: true
      chunk-size: 300
      overlap: 50